<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTOS DOM</title>
    <style>
        div#area{
            background-color: aliceblue;
            width: 200px;
            height: 200px;
            margin: auto;
            padding: 70px;
            font-size: 30px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <div id="area" onmouseenter="entrar()">INTERAJA</div>

    <script>
        var a = document.getElementById('area')
        a.addEventListener('onmouseenter' , entrou)
        a.addEventListener('onmouseout', sAIU)

        function entrar(){
            a.innerHTML = 'entrou'
        }
        
    </script>
</body>
</html>
