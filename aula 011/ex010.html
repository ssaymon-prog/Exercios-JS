<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;

        }
    </style>
</head>
<body>
    <h1>Sistema de Multa</h1>
    Velocidade do carro : <input type="number" name="txtvel" id="txtvel"> KM/H
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res">Resultado</div>

    <script>
        
    function calcular(){
     let v = document.getElementById("txtvel")
     let vel = Number(v.value)
     let res = document.getElementById("res")
     
     if (vel > 60){
        res.innerHTML = `<strong><p style = "color: red;">Você está MULTADO por excesso de velocidade</p></strong>`
        
     } 
      res.innerHTML += `<p><strong>Dirija sempre com sinto de segurança</strong></p>`
        }
    </script>

    
</body>
</html>
