<!doctype html>
<html lang="ept-bt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        text-align: justify;
        line-height: 30px;
        font-size: 20px;
      }
      footer {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Olá mundo</h1>
    <script>
      var nome = window.prompt("Qual o seu nome ? ");
      document.writeln(`Olá <strong>${nome}</strong>! </br>`);
      document.writeln(`Seu nome tem ${nome.length} letras <br/>`);
      document.writeln(`Seu nome em maiúsculo é : ${nome.toUpperCase()} <br/>`);
      document.writeln(`Seu nome em minúsculo é: ${nome.toLowerCase()}`);
    </script>
    <footer>
      <p>&copy; Saymon Dev</p>
    </footer>
  </body>
</html>
